[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/api/v1"

# Let React Router handle direct links and page refreshes.
# Existing images, scripts, and styles are served normally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
